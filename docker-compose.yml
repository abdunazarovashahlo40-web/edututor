# Lokal yoki VPS uchun: docker compose up -d --build
# HTTPS bilan VPS: docker compose --profile proxy up -d  (nginx/edututor.conf ga qarang)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edututor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edututor_dev_password}
      POSTGRES_DB: edututor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edututor"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    env_file: backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://edututor:${POSTGRES_PASSWORD:-edututor_dev_password}@db:5432/edututor?schema=public
      DIRECT_URL: postgresql://edututor:${POSTGRES_PASSWORD:-edututor_dev_password}@db:5432/edututor?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/uploads
    ports:
      - "127.0.0.1:4000:4000"

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/edututor.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot

volumes:
  pgdata:
  uploads:
