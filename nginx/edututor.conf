# Ubuntu VPS uchun Nginx (HTTPS + WebSocket). DOMAIN ni o'zingiznikiga almashtiring.
# Sertifikat: sudo certbot certonly --webroot -w ./nginx/certbot -d edututor.uz -d www.edututor.uz

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name edututor.uz www.edututor.uz;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name edututor.uz www.edututor.uz;

  ssl_certificate     /etc/letsencrypt/live/edututor.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/edututor.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 12m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /socket.io/ {
    proxy_pass http://app:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://app:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
